<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Me</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f7fb;
    color:#333;
}

/* HEADER */
header{
    width:100%;
    background:#1f2937;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:white;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.menu{
    display:flex;
    align-items:center;
    gap:25px;
}

.menu a{
    text-decoration:none;
    color:white;
    font-size:18px;
    padding:8px 15px;
    border-radius:6px;
    transition:0.3s;
}

.menu a:hover{
    background:#00ffbf;
    color:#1f2937;
}

.menu a.active{
    background:#00ffbf;
    color:#1f2937;
    font-weight:bold;
}

select{
    padding:8px;
    border:none;
    border-radius:5px;
}

/* CONTACT */
.contact-section{   
    width:90%;
    margin:50px auto;
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.contact-section h1{
    text-align:center;
    color:#1f2937;
    margin-bottom:20px;
    font-size:40px;
}

.contact-section p{
    text-align:center;
    font-size:20px;
    line-height:1.8;
    margin-bottom:40px;
}

.contact-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
}

.contact-box{
    width:300px;
    background:#f9fafb;
    border-radius:10px;
    padding:30px;
    text-align:center;
    transition:0.3s;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.contact-box:hover{
    transform:translateY(-5px);
    background:#d1fae5;
}

.contact-box h2{
    color:#00a86b;
    margin-bottom:15px;
}

.contact-box p{
    font-size:18px;
    color:#444;
}

/* FORM */
.contact-form{
    margin-top:50px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    padding:15px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    font-size:16px;
}

.contact-form textarea{
    height:150px;
    resize:none;
}

.contact-form button{
    padding:15px;
    border:none;
    border-radius:8px;
    background:#00b36b;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.contact-form button:hover{
    background:#008f55;
}

/* FOOTER */
footer{
    margin-top:40px;
    background:#1f2937;
    color:white;
    text-align:center;
    padding:20px;
}

footer span{
    color:#00ffbf;
    font-weight:bold;
}
</style>
</head>

<body>

<header>

    <div class="logo" id="logoText">My Portfolio</div>

    <div class="menu">

        <a href="index.html" id="homeText">Home</a>
        <a href="about.html" id="aboutText">About</a>
        <a href="contact.html" id="contactText">Contact</a>

        <select id="language" onchange="translatePage(); setLanguage(this.value)">
            <option value="en">English</option>
            <option value="rw">Kinyarwanda</option>
        </select>

    </div>

</header>

<section class="contact-section">

    <h1 id="titleText">Contact Me</h1>

    <p id="paragraphText">
        Feel free to contact me for collaboration, project development, or any software development support.
    </p>

    <div class="contact-container">

        <div class="contact-box">
            <h2 id="phoneTitle">Phone Number</h2>
            <p>0798809775</p>
        </div>

        <div class="contact-box">
            <h2 id="emailTitle">Email Address</h2>
            <p>theodush758@gmail.com</p>
        </div>

        <div class="contact-box">
            <h2 id="locationTitle">Location</h2>
            <p>Kigali, Rwanda</p>
        </div>

    </div>

    <form class="contact-form">

        <input type="text" id="nameInput" placeholder="Enter Your Name">
        <input type="email" id="emailInput" placeholder="Enter Your Email">
        <textarea id="messageInput" placeholder="Write Your Message"></textarea>

        <button type="submit" id="sendButton">Send Message</button>

    </form>

</section>

<footer>

    <p id="footerText">Developed with by Theoneste</p>

    <p>Current Time: <span id="time"></span></p>

</footer>

<script>

/* SAVE LANGUAGE */
function setLanguage(lang){
    localStorage.setItem("lang", lang);
}

/* LOAD SAVED LANGUAGE */
function getLanguage(){
    return localStorage.getItem("lang") || "en";
}

/* TIME */
function updateTime(){
    document.getElementById("time").innerHTML =
    new Date().toLocaleString();
}
setInterval(updateTime,1000);
updateTime();

/* TRANSLATIONS */
const translations = {
    en:{
        home:"Home",
        about:"About",
        contact:"Contact",
        title:"Contact Me",
        paragraph:"Feel free to contact me for collaboration, project development, or any software development support.",
        phone:"Phone Number",
        email:"Email Address",
        location:"Location",
        namePlaceholder:"Enter Your Name",
        emailPlaceholder:"Enter Your Email",
        messagePlaceholder:"Write Your Message",
        send:"Send Message",
        footer:"Developed with by Theoneste"
    },

    rw:{
        home:"Ahabanza",
        about:"Ibyanjye",
        contact:"Twandikire",
        title:"Twandikire",
        paragraph:"Wanyandikira ku bijyanye n’imikoranire, gukora projects cyangwa ubufasha muri software.",
        phone:"Numero ya Telephone",
        email:"Email",
        location:"Aho Mbarizwa",
        namePlaceholder:"Andika Amazina Yawe",
        emailPlaceholder:"Andika Email Yawe",
        messagePlaceholder:"Andika Ubutumwa",
        send:"Ohereza",
        footer:"Byakozwe na Theoneste"
    }
};

/* APPLY TRANSLATION */
function translatePage(){

    const lang = document.getElementById("language").value;
    const t = translations[lang];

    document.getElementById("homeText").innerText = t.home;
    document.getElementById("aboutText").innerText = t.about;
    document.getElementById("contactText").innerText = t.contact;

    document.getElementById("titleText").innerText = t.title;
    document.getElementById("paragraphText").innerText = t.paragraph;

    document.getElementById("phoneTitle").innerText = t.phone;
    document.getElementById("emailTitle").innerText = t.email;
    document.getElementById("locationTitle").innerText = t.location;

    document.getElementById("nameInput").placeholder = t.namePlaceholder;
    document.getElementById("emailInput").placeholder = t.emailPlaceholder;
    document.getElementById("messageInput").placeholder = t.messagePlaceholder;

    document.getElementById("sendButton").innerText = t.send;
    document.getElementById("footerText").innerText = t.footer;
}

/* INIT LANGUAGE ON PAGE LOAD */
window.onload = function(){

    const savedLang = getLanguage();

    document.getElementById("language").value = savedLang;
    translatePage();

};

</script>

</body>
</html>
